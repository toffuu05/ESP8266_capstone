[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = default
upload_speed = 460800

; Port is auto-detected. Only set these if you have several boards plugged in:
; upload_port = COM4
; monitor_port = COM4
